; Todo lo que hace falta para que un echo llegue al socket en el momento.
; Si alguna de estas tres esta mal, el stream se ve "congelado".
output_buffering = 0
zlib.output_compression = Off
implicit_flush = On

; Una conexion SSE no debe morir por timeout de ejecucion.
max_execution_time = 0

memory_limit = 256M

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
