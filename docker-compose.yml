services:
  redis:
    image: redis:7-alpine
    # Sin persistencia: los streams son historial efimero para reconexiones.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    # Las conexiones SSE abiertas no deben demorar el apagado.
    stop_grace_period: 5s

  web:
    image: node:22-alpine
    working_dir: /app
    # node_modules se instala dentro del contenedor (el del host tiene binarios
    # de Windows que no corren en alpine).
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npx ng serve --host 0.0.0.0 --port 4200 --poll 1000"
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      NG_CLI_ANALYTICS: "false"
    depends_on:
      - api

volumes:
  web_node_modules:
