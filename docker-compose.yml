services:
  redis:
    image: redis:7-alpine
    # Sin persistencia: los streams son historial efimero para reconexiones.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Estado del driver 'apigateway' (conexiones, suscripciones, historial).
  # En memoria: igual que Redis, es efimero.
  dynamodb:
    image: amazon/dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8001:8000"

  # Emulador de API Gateway WebSocket: sostiene los sockets del navegador y
  # llama a Laravel por HTTP, igual que la API real de infra/template.yaml.
  gateway-local:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && node server.js"
    ports:
      - "3001:3001"
    volumes:
      - ./gateway-local:/app
      - gateway_node_modules:/app/node_modules
    environment:
      BACKEND: http://api:8000
      WS_GATEWAY_SECRET: dev-only-gateway-secret
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      WS_MANAGEMENT_ENDPOINT: http://gateway-local:3001
      # Hub Mercure dentro de FrankenPHP. Caddy lee estas claves del entorno
      # del proceso (no del .env), y Laravel las toma de aca tambien.
      MERCURE_PUBLISHER_JWT_KEY: dev-only-mercure-publisher-key-min-32-bytes
      MERCURE_SUBSCRIBER_JWT_KEY: dev-only-mercure-subscriber-key-min-32-bytes
      MERCURE_CORS_ORIGINS: http://localhost:4200
      MERCURE_COOKIE_NAME: mercureAuthorization
      # Claim iss de los tokens que firma Laravel; el hub solo confia en este.
      MERCURE_ISSUER: http://localhost:8000
    depends_on:
      redis:
        condition: service_healthy
      dynamodb:
        condition: service_started
    # Las conexiones SSE abiertas no deben demorar el apagado.
    stop_grace_period: 5s

  web:
    image: node:22-alpine
    working_dir: /app
    # node_modules se instala dentro del contenedor (el del host tiene binarios
    # de Windows que no corren en alpine).
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npx ng serve --host 0.0.0.0 --port 4200 --poll 1000"
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      NG_CLI_ANALYTICS: "false"
    depends_on:
      - api

volumes:
  web_node_modules:
  gateway_node_modules:
